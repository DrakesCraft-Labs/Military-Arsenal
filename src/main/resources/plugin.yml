name: WeaponsAddon
version: '${project.version}'
main: com.Chagui68.weaponsaddon.WeaponsAddon
api-version: '26.2'
depend: [Slimefun]
loadbefore: [Networks]
author: Chagui68
description: Military Arsenal addon de Slimefun para Paper/Purpur 1.21.11: armas, municiones, torretas defensivas, maquinas de guerra y bombardeo por coordenadas.

commands:
  weapons:
    description: Main command for Military Arsenal
    usage: /weapons <delete|reload> <args>
    permission: militaryarsenal.admin
    permission-message: You don't have permission to use this command!

permissions:
  militaryarsenal.admin:
    description: Access to Military Arsenal admin commands
    default: op